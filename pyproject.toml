[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "stockstudy"
version = "0.9.2"
description = "Local daily-bar stock screening with pluggable data sources"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
stockstudy = "stockstudy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]
sources = {"src" = "stockstudy"}

[tool.hatch.build]
dev-mode-dirs = ["."]

[tool.hatch.build.targets.wheel.force-include]
"resources/security_names.csv" = "stockstudy/resources/security_names.csv"

"resources/candlestick.png" = "stockstudy/resources/candlestick.png"
